[project]
name = "01-environment-setup"
version = "0.1.0"
description = "Environment setup for the AI security labs"
readme = "README.md"
requires-python = "~=3.12.0"


dependencies = [
    # The existing mlc dataset interface uses NumPy APIs removed in NumPy 2.
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "torch==2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # PyTorch 2.2 is the last release with Intel macOS wheels.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "serval-ml-commons==0.1.4",
    "ipykernel==6.30.1",
    "tqdm==4.67.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
