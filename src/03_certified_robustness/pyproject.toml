[project]
name = "03-certified-robustness"
version = "0.1.0"
description = "Certified robustness with auto-LiRPA on CIFAR-10"
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "auto-lirpa",
    "torch==2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision==0.23.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy==1.26.4",
    "matplotlib==3.10.6",
    "pandas==2.3.3",
    "ipykernel==6.30.1",
    "nbclient==0.10.2",
    # auto-LiRPA imports torch.utils.cpp_extension even for CPU evaluation.
    "setuptools==80.9.0",
]

[tool.uv.sources]
# May 2026 release: compatible with both NumPy 1 and Intel macOS PyTorch.
auto-lirpa = { git = "https://github.com/Verified-Intelligence/auto_LiRPA.git", rev = "a050a3d61f4cb68b108fa7f07dcb3e4d7ef304df" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
